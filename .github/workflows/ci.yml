name: CI

on:
  push:
  pull_request:

jobs:
  # The std-only core library and its unit tests: no Qt needed, fast.
  core:
    name: Core and tests (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ catch2
      - name: Configure
        run: >
          cmake --preset debug
          -DZUB_BUILD_APP=OFF -DZUB_BUILD_CONVERTER=OFF
          -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug

  # The whole app. Ubuntu's runner image has Qt 6.4 and no KF6, so the build
  # runs in a Fedora container with Qt >= 6.5 and KF6 SyntaxHighlighting.
  app:
    name: App (Fedora)
    runs-on: ubuntu-24.04
    container: fedora:42
    steps:
      - name: Install dependencies
        run: |
          dnf install -y git gcc-c++ cmake ninja-build \
            qt6-qtbase-devel qt6-qtsvg-devel qt6-qtpdf-devel qt6-qtmultimedia-devel qt6-qttools-devel \
            qt6-linguist kf6-syntax-highlighting-devel catch-devel \
            cargo rust openssl-devel pkgconf-pkg-config
      - uses: actions/checkout@v5
        with:
          submodules: recursive # external/chords_converter
      - name: Configure
        run: cmake --preset debug -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build --preset debug
      - name: Test
        run: ctest --preset debug
      - name: Start the app headless
        run: |
          # It runs until the timeout kills it: exit 124 means it started fine.
          set +e
          QT_QPA_PLATFORM=offscreen timeout 3 build/debug/app/zpevnikar
          status=$?
          set -e
          echo "exit status: $status"
          test "$status" -eq 124
      - name: Translations complete
        run: |
          if grep -n 'type="unfinished"' app/i18n/zpevnikar_cs.ts; then
            echo "Untranslated Czech texts: translate them in app/i18n/zpevnikar_cs.ts"
            exit 1
          fi

  # The app on Windows: build and tests, so new Linux-only code is noticed. (Windows users still
  # need the Windows parts of PLAN.md: stopping builds, bash for build.sh, a package.)
  windows:
    name: App (Windows)
    runs-on: windows-2022
    env:
      QT_VERSION: 6.8.3
    # PowerShell, not Git Bash: Git's usr/bin has a Unix `link` that cargo would take for
    # MSVC's link.exe.
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/msvc-env
      - name: Ninja
        run: choco install ninja --no-progress -y
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia qtpdf
          aqtversion: '==3.3.*'
          cache: true
      - uses: ./.github/actions/kf6-syntax-highlighting
        with:
          prefix: ${{ runner.temp }}/kf6
          qt-version: ${{ env.QT_VERSION }}
      # Release: KF6 is built against Qt's release DLLs, which a debug build cannot share.
      - name: Configure
        run: cmake --preset release -DCMAKE_PREFIX_PATH="$env:RUNNER_TEMP/kf6"
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: |
          $env:PATH = "$env:RUNNER_TEMP\kf6\bin;$env:PATH"
          ctest --preset release
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-test-log
          path: build/release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
